name: Create Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0) — run this workflow from main'
        required: true
        type: string
      draft:
        description: 'Create as a draft release?'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: releases-main
      queue: max # Do not replace pending releases when multiple PRs merge.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRAFT: ${{ inputs.draft }}
        run: bash .github/scripts/release.sh
